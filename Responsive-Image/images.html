<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolution Switching Gallery</title>
  </head>
  <body>
    <h1>Responosive Image Gallery</h1>
    <img
      src="https://picsum.photos/id/800/200/300"
      srcset="https://picsum.photos/id/800/400/300 400w, https://picsum.photos/id/800/800/600 800w, https://picsum.photos/id/800/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      alt="hero-banner"
      loading="eager" />

    <img
      src="https://picsum.photos/id/829/200/300"
      srcset="https://picsum.photos/id/829/400/300 400w, https://picsum.photos/id/829/800/600 800w, https://picsum.photos/id/829/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      alt="nature"
      loading="lazy" />

    <img
      src="https://picsum.photos/id/870/200/300"
      srcset="https://picsum.photos/id/870/400/300 400w, https://picsum.photos/id/870/800/600 800w, https://picsum.photos/id/870/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <img
      src="https://picsum.photos/id/602/200/300"
      srcset="https://picsum.photos/id/602/400/300 400w, https://picsum.photos/id/602/800/600 800w, https://picsum.photos/id/602/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <img
      src="https://picsum.photos/seed/picsum/200/300"
      srcset="
        https://picsum.photos/seed/picsum/400/300   400w,
        https://picsum.photos/seed/picsum/800/600   800w,
        https://picsum.photos/seed/picsum/1200/900 1200w
      "
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <img
      src="https://picsum.photos/id/900/200/300"
      srcset="https://picsum.photos/id/900/400/300 400w, https://picsum.photos/id/900/800/600 800w, https://picsum.photos/id/900/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <img
      src="https://picsum.photos/id/888/200/300"
      srcset="https://picsum.photos/id/888/400/300 400w, https://picsum.photos/id/888/800/600 800w, https://picsum.photos/id/888/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <img
      src="https://picsum.photos/id/764/200/300"
      srcset="https://picsum.photos/id/764/400/300 400w, https://picsum.photos/id/764/800/600 800w, https://picsum.photos/id/764/1200/900 1200w"
      sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
      loading="lazy" />

    <picture>
      <h1>Performance & Art Direction</h1>
      <source media="(min-width: 800px)" srcset="https://picsum.photos/id/237/1200/500" />
      <source media="(max-width: 799px)" srcset="https://picsum.photos/id/237/400/400" />
      <img src="https://picsum.photos/id/237/400/400" alt="Dog" />
    </picture>
    <picture>
      <source media="(min-width: 800px)" srcset="https://picsum.photos/id/10/1200/500" />
      <source media="(max-width: 799px)" srcset="https://picsum.photos/id/10/400/400" />
      <img src="https://picsum.photos/id/10/400/400" alt="nature landscape" />
    </picture>
  </body>
</html>
